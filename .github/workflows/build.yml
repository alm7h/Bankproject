# Baut das Projekt bei jedem Push auf main und bei jedem Pull Request:
# Kompilieren, SpotBugs, alle Tests, JaCoCo-Bericht, JavaDoc und Paketierung (mvn verify).
# Die Tests laufen zweimal - mit Standard-Locale und mit deutscher Locale -, weil
# Ausgaben wie Geldbetrag.toString vom Locale abhängen.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.locale }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [default, de_DE]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test (default locale)
        if: matrix.locale == 'default'
        run: ./mvnw -B verify

      - name: Build and test (German locale)
        if: matrix.locale == 'de_DE'
        run: ./mvnw -B verify -DargLine="-Duser.language=de -Duser.country=DE"

      - name: Keep the coverage report
        if: matrix.locale == 'default'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
